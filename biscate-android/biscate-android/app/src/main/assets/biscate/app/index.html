<style>

svg{display:block;flex:none}

.ib{width:40px;height:40px;border-radius:50%;background:var(--fl);display:grid;place-items:center;flex:none;position:relative}

.tabs{display:flex;padding:6px 8px 4px}.tabs button{flex:1;padding:6px 0;font-size:11px;font-weight:500;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px}.tabs .on{color:var(--br);font-weight:700}

.btn{display:block;width:100%;padding:16px;border-radius:14px;background:var(--pr);color:var(--pt);font-weight:700;text-align:center;font-size:16px}.btn.g{background:var(--fl);color:var(--tx)}
.hero{font-size:32px;line-height:1.05;font-weight:800;letter-spacing:-.035em;margin:2px 0 16px}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;margin:20px 0 6px}

.dk{position:relative;overflow:hidden;background:var(--pr);color:var(--pt);border-radius:22px;padding:20px;margin:18px 0}.dk.rd{background-color:#C8102E;color:#fff;box-shadow:0 10px 24px rgba(200,16,46,.28)}

.th{position:relative;overflow:hidden;height:124px;border-radius:18px;margin-bottom:8px}.th svg{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%)}
.it{display:flex;align-items:center;gap:14px;width:100%;padding:14px 0;border-bottom:1px solid var(--ln);text-align:left}

.f{width:100%;padding:15px;border-radius:12px;border:2px solid transparent;background:var(--fl);margin:6px 0 16px;font-size:16px}.f:focus{outline:0;border-color:var(--tx);background:var(--bg)}
label{font-size:13px;font-weight:600}

.bar2{height:6px;border-radius:9px;background:rgba(127,127,127,.35);overflow:hidden;margin-top:14px}.bar2 i{display:block;height:100%;background:var(--gn)}

.cmp{display:flex;gap:10px;padding:8px 16px 12px;align-items:center}.cmp input{flex:1;padding:13px 16px;border-radius:99px;border:0;background:var(--fl);font-size:16px}.cmp input:focus{outline:2px solid var(--tx)}.cmp button{width:44px;height:44px;border-radius:50%;background:var(--pr);color:var(--pt);display:grid;place-items:center}

.rc{background:var(--fl);border-radius:16px;padding:6px 16px;margin-bottom:14px}.rc div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--fl2)}.rc div:last-child{border:0}.rc b{letter-spacing:.02em}

.oa{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:15px;border-radius:14px;font-weight:600;font-size:16px;margin-bottom:10px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--br);flex:none}
.tt{background:var(--fl);border-radius:18px;padding:16px;width:250px!important;font-size:14px}
.band{height:14px;background:linear-gradient(90deg,#111 50%,#F7B500 50%)}
#spl{position:absolute;inset:0;z-index:9;background-color:#C8102E;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px;transition:opacity .5s}#spl.off{opacity:0;pointer-events:none}

#to{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--pr);color:var(--pt);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;z-index:8}#to.on{opacity:1}
button:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

notif:()=>({t:"Notificações",back:1,h:(S.mode=="cli"?[["chat","Joaquim Neto respondeu à sua mensagem","há 10 min"],["star","Avalie o trabalho do Manuel Kiala","ontem"],["check","O seu pedido de orçamento foi aceite","há 2 dias"]]:[["chat","Ana Matos enviou uma mensagem","há 5 min"],["clock","O seu plano termina em breve. Renove.","hoje"],["eye","12 pessoas viram o seu perfil esta semana","ontem"]]).map(n=>`<div class="it"><span class="ib">${ic(n[0],19)}</span><div class="fl">${n[1]}<div class="mu sm">${n[2]}</div></div></div>`).join("")}),
favs:()=>{const L=P.filter(p=>S.fav[p.id]);return{t:"Favoritos",back:1,h:L.map(item).join("")||`<div style="text-align:center;margin-top:40px">${sf("Pedreiro",130)}<div class="b" style="margin-top:6px">Ainda sem favoritos</div><div class="mu sm">Toque no coração de um perfil para o guardar.</div></div>`}},
help:()=>({t:"Ajuda",back:1,h:[["Como contacto um profissional?","Abra o perfil e toque em Conversar ou Ligar. É grátis para clientes."],["O que significa Verificado?","A equipa confirmou o BI e o telefone do profissional."],["Como pago ao profissional?","Combinem entre vocês, em dinheiro ou transferência. O pagamento protegido chega numa fase futura."],["Como funciona o plano?","O profissional paga um plano de 3 dias, 1 semana, 1 mês ou 1 ano. Com plano activo, o perfil aparece nas pesquisas."],["Quero denunciar alguém","No perfil, toque em Denunciar. A equipa analisa em 24 horas."]].map(f=>`<details><summary>${f[0]}${ic("down",18)}</summary><p>${f[1]}</p></details>`).join("")}),
me:()=>{const s=S.mode=="sel";return{t:"Perfil",h:`<div class="row" style="margin:8px 0 18px">${av(s?"Joaquim Neto":"Ana Matos",s?"#1E5F4B":"#8A3A1F",64)}<div><div class="b" style="font-size:21px;letter-spacing:-.02em">${s?"Joaquim Neto":"Ana Matos"}</div><div class="mu">${s?"Electricista · Talatona":"Maianga, Luanda"}</div></div></div>`+
(s?row("edit","Editar perfil",'data-g="edit"')+row("shield","Pedir selo Verificado",'data-a="toast" data-v="Pedido enviado à equipa"'):row("heart","Favoritos",'data-g="favs"',Object.keys(S.fav).length))+row("bell","Notificações",'data-g="notif"')+row("globe","Idioma",'data-a="toast" data-v="Em breve: Umbundu, Kimbundu e Kikongo"',"Português")+row("help","Ajuda",'data-g="help"')+row("file","Termos e privacidade",'data-a="toast" data-v="Abre os termos de uso"')+row("logout","Terminar sessão",'data-a="logout"')+
`<button class="it" style="margin-top:22px;border:0;background:var(--fl);border-radius:18px;padding:18px" data-a="mode"><span>${ic("swap",22,1.8)}</span><div class="fl"><div class="b">${s?"Mudar para conta de cliente":"Quero vender o meu serviço"}</div><div class="mu sm">${s?"Procure serviços, é grátis.":"Mostre o seu trabalho a clientes perto de si."}</div></div>${ic("next",18)}</button>`}},
dash:()=>{const on=S.left>0,t=S.t.dash;let b;
 if(t=="res")b=`<div class="stt" style="background:var(--fl);border-radius:16px;margin-top:14px"><div><b>128</b><span class="mu sm">Visitas</span></div><div><b>17</b><span class="mu sm">Contactos</span></div><div><b>4.7</b><span class="mu sm">Nota</span></div></div><h2>Clientes à espera</h2>${CL.map(c=>`<button class="it" data-a="chat" data-v="c${c.id}">${av(c.n,c.col)}<div class="fl"><div class="b">${c.n}</div><div class="mu sm">${c.b} · pede orçamento</div></div><span class="pill k">Responder</span></button>`).join("")}<div class="rc" style="margin-top:18px;padding:16px"><div class="b" style="display:block;border:0;padding:0">Dica</div><div class="mu" style="display:block;border:0;padding:4px 0 0">Perfis com 3 ou mais fotos de trabalhos recebem mais contactos.</div></div>`;
 else{const vs=[8,14,11,19,16,22,18],ds=["S","T","Q","Q","S","S","D"];b=`<h2>Visitas esta semana</h2><div class="chart">${vs.map((v,i)=>`<div><i style="height:${v/22*100}px"></i>${ds[i]}</div>`).join("")}</div><h2>Como chegam até si</h2>${[["Mensagens",62],["Chamadas",28],["Pedidos",10]].map(x=>`<div class="row" style="gap:12px;margin:12px 0"><span style="width:84px">${x[0]}</span><div class="pb"><i style="width:${x[1]}%"></i></div><b class="sm" style="width:36px;text-align:right">${x[1]}%</b></div>`).join("")}`}
 return{hd:`<h1>Painel</h1><button class="ib" data-g="notif" aria-label="Notificações">${ic("bell",20)}</button>`,h:(on?`<div class="dk pat" style="margin-top:6px;padding-right:110px"><span class="pill g">Plano activo</span><div style="font-size:34px;font-weight:800;letter-spacing:-.03em;margin-top:10px">${S.left} dias</div><div class="sm" style="opacity:.7">O seu perfil aparece nas pesquisas.</div><div class="bar2"><i style="width:${Math.min(100,S.left/S.plan*100)}%"></i></div>${sf("Electricista",110,"position:absolute;right:-6px;bottom:-14px")}</div>`:`<div class="dk pat" style="margin-top:6px"><div class="b" style="font-size:22px;letter-spacing:-.02em;padding-right:90px">O seu perfil está invisível</div><div class="sm" style="opacity:.7;margin:6px 0 16px;padding-right:90px">O plano expirou. Escolha um plano para voltar a receber clientes.</div><button class="btn" style="background:var(--bg);color:var(--tx)" data-t="plans">Escolher plano</button>${sf("Canalizador",100,"position:absolute;right:-8px;top:8px;opacity:.9")}</div>`)+seg("dash",[["res","Resumo"],["est","Estatísticas"]])+b}},
plans:()=>({t:"Escolha o seu plano",h:`<div class="mu" style="margin-bottom:16px">Pague uma vez e apareça nas pesquisas durante todo o período.</div>`+PL.map((p,i)=>`<button class="pl ${S.sel==i?"on":""}" data-a="sel" data-v="${i}"><div><div class="b" style="font-size:17px">${p[1]}</div><div class="mu sm">${p[3]}</div></div><div class="b" style="font-size:18px">${p[2].toLocaleString("pt-PT")} Kz</div></button>`).join("")+`<button class="btn" style="margin-top:8px" data-g="pay">Continuar</button><div class="mu sm" style="text-align:center;margin-top:12px">Valores de exemplo.</div>`}),
pay:()=>{const p=PL[S.sel];return{t:"Pagamento",back:1,h:`<div class="mu">Plano ${p[1]}</div><div class="hero" style="margin:2px 0 4px">${p[2].toLocaleString("pt-PT")} Kz</div><div class="mu sm" style="margin-bottom:20px">Perfil visível até ${new Date(Date.now()+p[0]*864e5).toLocaleDateString("pt-PT")}</div><div class="b" style="margin-bottom:8px">Pagar por referência</div><div class="rc"><div><span class="mu">Entidade</span><b>90210</b></div><div><span class="mu">Referência</span><b>482 917 305</b></div><div><span class="mu">Valor</span><b>${p[2].toLocaleString("pt-PT")} Kz</b></div></div><div class="mu sm" style="margin-bottom:20px">Pague no Multicaixa Express, num ATM ou no internet banking. O plano activa sozinho quando o pagamento for confirmado.</div><button class="btn" data-a="paid">Já paguei</button><div class="mu sm" style="text-align:center;margin-top:12px">Demonstração: o pagamento é simulado.</div>`}},
wait:()=>({t:"",bar:"",h:`<div class="sp"></div><div class="b" style="text-align:center;font-size:18px">${S.wm}</div><div class="mu" style="text-align:center">Isto demora alguns segundos.</div>`}),
done:()=>({t:"",bar:"",h:`<div style="text-align:center;margin-top:50px"><span style="display:inline-grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--gn);color:#fff">${ic("check",42,3)}</span><div class="hero" style="margin:20px 0 6px">Plano activado</div><div class="mu" style="margin-bottom:28px">O seu perfil já aparece nas pesquisas.<br>Enviámos o recibo por SMS.</div><button class="btn" data-t="dash">Ver o meu painel</button></div>`}),
edit:()=>({t:"Editar perfil",back:1,h:`<label>Nome</label><input class="f" value="Joaquim Neto"><label>Serviços</label><input class="f" value="Instalações, quadros, avarias"><label>Zona de trabalho</label><input class="f" value="Talatona, Kilamba, Benfica"><label>Preço indicativo</label><input class="f" value="5.000 Kz/visita"><label>Sobre si</label><textarea class="f" rows="3">Atendo no mesmo dia.</textarea><label>Fotos de trabalhos</label><div class="ph" style="margin:8px 0 22px"><i style="background:#1E5F4B">${ic("zap",28,1.5)}</i><i style="background:#1E5F4B;opacity:.7">${ic("zap",28,1.5)}</i><i style="background:var(--fl);color:var(--mu)">${ic("plus",28,1.8)}</i></div><button class="btn" data-a="toast" data-v="Perfil guardado">Guardar</button>`})};
function render(){
  const v=V[S.view](),tabs=v.bar===undefined,act=PAR[S.view]||S.view;
  $("#hd").style.display=v.full?"none":"";$("#mn").style.padding=v.full?"0":"";
  $("#hd").innerHTML=v.hd||`${v.back?`<button class="ib" data-a="back" aria-label="Voltar">${ic("back",22)}</button>`:""}<h1${v.back?' style="font-size:22px"':""}>${v.t||""}</h1>`;
  $("#mn").innerHTML=v.h;
  $("#bar").style.display=v.bar===""?"none":"";
  $("#bar").innerHTML=tabs?`<div class="tabs">${TABS[S.mode].map(t=>`<button class="${t[0]==act?"on":""}" data-t="${t[0]}">${ic(t[1],24,t[0]==act?2.5:1.8)}${t[2]}</button>`).join("")}</div>`:v.bar;
  if(S.view=="list")res();
  if(S.view=="chat"){draw();const ci=$("#ci");ci.onkeydown=e=>{if(e.key=="Enter")send(ci.value)}}else $("#mn").scrollTop=0}
const rr=()=>{const y=$("#mn").scrollTop;render();$("#mn").scrollTop=y};
function res(){const q=S.q.toLowerCase(),k=S.t.sort,r=P.filter(p=>(!S.cat||p.c==S.cat)&&(p.n+p.c+p.b).toLowerCase().includes(q)).sort((a,b)=>k=="r"?b.r-a.r:k=="km"?a.km-b.km:parseInt(a.pr.replace(/\D/g,""))-parseInt(b.pr.replace(/\D/g,"")));$("#res").innerHTML=r.map(item).join("")||`<div style="text-align:center;margin-top:30px">${sf("Limpeza",120)}<div class="b">Nenhum resultado</div><div class="mu sm">Tente outra categoria ou bairro.</div></div>`}
function bub(m){
  if(m.k=="q")return`<div class="q"><div class="mu sm">Orçamento</div><big>15.000 Kz</big><div class="mu sm" style="margin-bottom:14px">1 dia de trabalho · materiais não incluídos</div>${m.a?'<span class="pill g">Aceite</span>':'<button class="btn" data-a="acc">Aceitar orçamento</button>'}</div>`;
  if(m.k=="rate")return`<div class="q"><div class="b">Como correu o serviço?</div><div class="stars">${[1,2,3,4,5].map(i=>`<button class="${m.s>=i?"on":""}" data-a="star" data-v="${i}" aria-label="${i} estrelas">${ic("star",30,0,"currentColor")}</button>`).join("")}</div></div>`;
  if(m.w=="sys")return`<div class="sy">${m.t}</div>`;
  return`<div class="bb ${m.w}">${m.k=="img"?`<div class="row" style="gap:8px">${ic("cam",20)}Foto enviada</div>`:m.t}<small>${m.h}</small></div>`}
function draw(){const ms=$("#ms");if(!ms)return;ms.innerHTML=(S.chats[S.p]||[]).map(bub).join("")+(S.ty?'<div class="bb ty"><s></s><s></s><s></s></div>':"");$("#mn").scrollTop=1e5}
function say(k,o){(S.chats[k]=S.chats[k]||[]).push({h:now(),...o})}
function send(t,img){if(!t.trim()&&!img)return;const k=S.p,cli=S.mode=="cli";say(k,{w:"me",t,k:img?"img":""});if($("#ci"))$("#ci").value="";draw();let r,q=0;
  if(img)r=cli?"Recebi a foto. Parece simples de resolver.":"Obrigada, já vi a foto.";
  else if(/orçamento/i.test(t))cli?q=1:r="Ok, fico a aguardar o seu orçamento.";
  else if(/custa|preço|valor/i.test(t))r="Depende do trabalho. Em média fica entre 10.000 e 20.000 Kz. Com fotos dou um preço certo.";
  else if(/amanhã|hoje|livre|quando|ir/i.test(t))r=cli?"Amanhã estou livre a partir das 8h. Em que bairro fica?":"Perfeito, venha hoje à tarde.";
  else if(/endere/i.test(t))r="Rua da Missão, casa 14, Maianga. Ligo quando chegar.";
  else r=cli?"Entendido! Pode dar-me mais detalhes do trabalho?":"Obrigada! Fico a aguardar.";
  S.ty=true;draw();setTimeout(()=>{S.ty=false;say(k,q?{w:"them",k:"q"}:{w:"them",t:r});if(S.view=="chat"&&S.p==k)draw()},1300)}
function go(v,p){S.hist.push([S.view,S.p]);S.view=v;if(p!==undefined)S.p=p;render()}
function tab(v){S.hist=[];S.view=v;render()}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-g]");if(g)return go(g.dataset.g,g.dataset.p);
  const t=e.target.closest("[data-t]");if(t)return tab(t.dataset.t);
  const a=e.target.closest("[data-a]");if(!a)return;const v=a.dataset.v;
  switch(a.dataset.a){
    case"back":{const h=S.hist.pop();if(h){S.view=h[0];S.p=h[1]}else S.view=S.mode=="cli"?"home":"dash";render();break}
    case"tab":S.t[a.dataset.n]=v;if(a.dataset.n=="prof"||a.dataset.n=="home")rr();else render();break;
    case"bairro":S.bairro=v;rr();break;
    case"fav":S.fav[v]?delete S.fav[v]:S.fav[v]=1;toast(S.fav[v]?"Guardado nos favoritos":"Removido dos favoritos");rr();break;
    case"cat":S.cat=v;if(S.view=="list")render();else go("list");break;
    case"chat":if(!S.chats[v])S.chats[v]=[{w:"them",t:"Bom dia! Em que posso ajudar?",h:now()}];delete S.un[v];go("chat",v);break;
    case"chip":v=="Enviar foto"?send("",1):send(v);break;
    case"send":send($("#ci").value);break;
    case"acc":{const q=S.chats[S.p].filter(m=>m.k=="q").pop();q.a=1;say(S.p,{w:"sys",t:"Orçamento aceite. Combinem dia e hora."});say(S.p,{w:"sys",k:"rate",s:0});draw();break}
    case"star":{S.chats[S.p].filter(m=>m.k=="rate").pop().s=+v;draw();toast("Avaliação enviada. Obrigado!");break}
    case"rq":S.rq[a.dataset.k]=v;{const d=$("#rd").value,b=$("#rb").value;render();$("#rd").value=d;$("#rb").value=b}break;
    case"pub":S.orders.unshift({p:0,t:S.rq.cat+": "+($("#rd").value||"sem descrição"),st:"À espera de propostas",d:0});S.t.orders="act";S.hist=[];S.view="orders";render();toast("Pedido publicado");break;
    case"sel":S.sel=+v;render();break;
    case"login":S.wm=v=="visitante"?"A abrir o Biscate":"A iniciar sessão com "+v;S.view="wait";render();setTimeout(()=>{S.mode="cli";S.view="home";S.hist=[];render();toast(v=="visitante"?"Está a navegar como visitante":"Sessão iniciada")},1400);break;
    case"logout":S.mode="cli";S.hist=[];S.view="login";render();break;
    case"paid":S.wm="A confirmar o pagamento";S.view="wait";render();setTimeout(()=>{S.plan=PL[S.sel][0];S.left=S.plan;S.view="done";S.hist=[];render()},1600);break;
    case"mode":S.mode=S.mode=="cli"?"sel":"cli";S.hist=[];S.view=S.mode=="cli"?"home":"dash";render();toast(S.mode=="cli"?"Conta de cliente":"Conta de profissional");break;
    case"toast":toast(v);break}});
document.addEventListener("input",e=>{if(e.target.id=="q"){S.q=e.target.value;res()}});
const sp=$("#spl");sp.innerHTML=`${mark(96,1)}<div class="wm">biscate</div><p>O seu kamba para qualquer biscate.</p><div class="band" style="position:absolute;left:0;right:0;bottom:0"></div>`;setTimeout(()=>sp.classList.add("off"),2200);
render();
</script></body></html>
